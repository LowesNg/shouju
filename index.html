<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四季荟公寓 2026年11月 收据查询</title>
<style>
  :root { --brand:#e8552d; --brand2:#f6a32f; --ink:#2b2b2b; --bg:#f5f2ec; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#ffe9d6 0%,#fff6ec 45%,#f3ece0 100%);
    min-height:100vh; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px;
  }
  .head { text-align:center; margin:10px 0 26px; }
  .head .logo { font-size:15px; letter-spacing:2px; color:#b2592a; font-weight:600; }
  .head h1 { font-size:24px; margin:8px 0 4px; color:#5a2d14; }
  .head p { font-size:13px; color:#9a7a63; }
  .card {
    background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(180,120,60,.14);
    padding:28px 22px; width:100%; max-width:430px;
  }
  .step-title { font-size:14px; color:#8a6a50; margin-bottom:14px; font-weight:600; }
  input[type=tel] {
    width:100%; padding:14px 16px; font-size:18px; letter-spacing:2px;
    border:1.5px solid #e8d5c2; border-radius:12px; outline:none; text-align:center;
    transition:.2s; background:#fffaf5;
  }
  input[type=tel]:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(232,85,45,.12); }
  button {
    width:100%; margin-top:14px; padding:14px; font-size:17px; font-weight:700;
    color:#fff; border:none; border-radius:12px; cursor:pointer; letter-spacing:4px;
    background:linear-gradient(90deg,var(--brand),var(--brand2));
    transition:.15s;
  }
  button:active { transform:scale(.98); }
  .msg { margin-top:16px; font-size:14px; line-height:1.7; text-align:center; min-height:22px; }
  .msg.err { color:#c0392b; }
  .msg.ok { color:#1e8449; }

  /* 收据卡片 */
  .receipt {
    margin-top:22px; border:1.5px dashed #d9c4ae; border-radius:14px;
    padding:18px 16px; background:#fffdf9; text-align:left;
  }
  .receipt .r-head { text-align:center; border-bottom:1px solid #f0e2d2; padding-bottom:10px; margin-bottom:12px; }
  .receipt .r-no { font-size:12px; color:#b98a60; }
  .receipt .r-title { font-size:15px; font-weight:700; color:#5a2d14; margin-top:4px; }
  .receipt .r-info { font-size:13px; color:#7a5a40; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  table td { padding:7px 4px; border-bottom:1px solid #f5eadc; color:#4a3a2c; }
  table td:last-child { text-align:right; font-weight:600; }
  table tr.total td { border-bottom:none; font-size:16px; font-weight:800; color:#c0392b; padding-top:12px; }
  .r-foot { margin-top:10px; font-size:11px; color:#b6a08a; text-align:center; }
  .multi-tip { font-size:12px; color:#b98a60; text-align:center; margin-top:4px; }

  /* 过期提示 */
  .card.expired { text-align:center; padding:34px 22px; }
  .expired-icon { font-size:42px; margin-bottom:12px; }
  .expired-title { font-size:19px; font-weight:700; color:#8a5a3a; margin-bottom:12px; }
  .expired-msg { font-size:13.5px; color:#9a7a63; line-height:1.9; }
  .foot { margin-top:22px; text-align:center; font-size:12px; color:#c0a98f; }
  .expiry-note { margin-top:6px; color:#b98a60; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">四季荟公寓 · 自助服务</div>
    <h1>四季荟公寓 2026年11月 收据查询</h1>
    <p>请输入您登记的手机号，查看自己的当月收据</p>
  </div>

  <div class="card" id="queryCard">
    <div class="step-title">📱 手机号登录</div>
    <input type="tel" id="phone" placeholder="请输入 11 位手机号" maxlength="11" inputmode="numeric">
    <button onclick="query()">查 看 收 据</button>
    <div class="msg" id="msg"></div>
    <div id="result"></div>
  </div>

  <div class="card expired" id="expiredCard" style="display:none;">
    <div class="expired-icon">⏰</div>
    <div class="expired-title">本期收据查询已结束</div>
    <div class="expired-msg" id="expiredMsg"></div>
  </div>

  <div class="foot">
    <div id="footNote">如查不到，请确认手机号与登记时一致，或联系管家核对。</div>
    <div id="expiryNote" class="expiry-note"></div>
  </div>

  return H.map(function(v){ return ((v>>>0).toString(16).length<8?"0".repeat(8-(v>>>0).toString(16).length):"")+(v>>>0).toString(16); }).join("");
}

function hexToBytes(hex) {
  var a = [];
  for (var i = 0; i < hex.length; i += 2) a.push(parseInt(hex.substr(i, 2), 16));
  return a;
}

/* XOR 解密：key = SHA256(手机号) 的字节 */
function decrypt(b64, phoneHex) {
  var key = hexToBytes(phoneHex);
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key[i % key.length];
  return new TextDecoder("utf-8").decode(bytes);
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function receiptHTML(r) {
  return '<div class="receipt">'
    + '<div class="r-head">'
    +   '<div class="r-no">收据号：' + esc(r.no) + '</div>'
    +   '<div class="r-title">四季荟公寓 2026年11月 租金及水电费扣款收据</div>'
    +   '<div class="r-info">房号 ' + esc(r.room) + ' · ' + esc(r.name) + '</div>'
    + '</div>'
    + '<table>'
    +   '<tr><td>公寓租金</td><td>' + esc(r.rent) + ' 元</td></tr>'
    +   '<tr><td>物业管理费</td><td>' + esc(r.mgmt) + ' 元</td></tr>'
    +   '<tr><td>租金税</td><td>' + esc(r.tax || '0') + ' 元</td></tr>'
    +   '<tr><td>上月电费（' + esc(r.e_deg) + ' 度）</td><td>' + esc(r.e_amt) + ' 元</td></tr>'
    +   '<tr><td>上月电费管理费</td><td>' + esc(r.e_mgmt) + ' 元</td></tr>'
    +   '<tr><td>上月水费（' + esc(r.w_deg) + ' 吨）</td><td>' + esc(r.w_amt) + ' 元</td></tr>'
    +   '<tr class="total"><td>本月应收合计</td><td>' + esc(r.total) + ' 元</td></tr>'
    + '</table>'
    + '<div class="r-foot">如有疑问请携带本收据号联系管家核对</div>'
    + '</div>';
}

function query() {
  var phone = document.getElementById("phone").value.trim().replace(/\s/g,"");
  var msg = document.getElementById("msg");
  var result = document.getElementById("result");
  msg.className = "msg"; msg.innerHTML = ""; result.innerHTML = "";
  if (!/^1\d{10}$/.test(phone)) {
    msg.className = "msg err"; msg.innerHTML = "请输入正确的 11 位手机号";
    return;
  }
  var h = sha256hex(phone);
  if (!DATA.hasOwnProperty(h)) {
    msg.className = "msg err";
    msg.innerHTML = "查不到该手机号的收据，请确认手机号与登记时一致，或联系管家核对。";
    return;
  }
  var items;
  try {
    items = JSON.parse(decrypt(DATA[h], h));
  } catch (e) {
    msg.className = "msg err"; msg.innerHTML = "数据解析失败，请联系管家。";
    return;
  }
  var html = items.map(receiptHTML).join("");
  if (items.length > 1) html = '<div class="multi-tip">您名下共 ' + items.length + ' 间房</div>' + html;
  result.innerHTML = html;
  msg.className = "msg ok"; msg.innerHTML = "查询成功";
}

document.getElementById("phone").addEventListener("keydown", function(e){
  if (e.key === "Enter") query();
});

/* ---------- 有效期控制：过期后隐藏查询区，只显示结束提示 ---------- */
function initExpiry() {
  var note = document.getElementById("expiryNote");
  if (EXPIRY_TEXT) note.textContent = "本期查询有效期至 " + EXPIRY_TEXT + " 23:59";
  if (EXPIRY && new Date() > new Date(EXPIRY)) {
    document.getElementById("queryCard").style.display = "none";
    document.getElementById("footNote").style.display = "none";
    document.getElementById("expiredCard").style.display = "block";
    document.getElementById("expiredMsg").innerHTML =
      "本期（2026年11月）收据查询已于 " + EXPIRY_TEXT + " 结束。<br>请向管家索取最新一期的查询链接。";
  }
}
window.addEventListener("DOMContentLoaded", initExpiry);
